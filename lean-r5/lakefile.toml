name = "erdos_1011_r5"
version = "1.0.0"
defaultTargets = ["R5Kernel"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "R5Kernel"
srcDir = "."
# Bound each checker process without invalidating already checked artifacts.
# Heavy targets must still be built individually to bound aggregate memory.
weakLeanArgs = ["-j1", "-M6144"]
